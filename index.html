<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesture Button - Science Week 2026</title>
<style>
  :root{
    --bg1:#0b1220;
    --bg2:#111a2e;
    --accent:#22e07a;
    --accent-dark:#0e8f4a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:radial-gradient(circle at 50% 20%, #182741 0%, var(--bg1) 55%, #050810 100%);
    font-family:"Segoe UI","Sarabun","Tahoma",sans-serif;
    color:#eaf2ff;
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    min-height:640px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---------- Top bar / instructions ---------- */
  .topbar{
    position:absolute; top:0; left:0; right:0;
    padding:16px 18px 10px;
    text-align:center;
    z-index:20;
  }
  .topbar h1{
    margin:0 0 4px;
    font-size:15px;
    letter-spacing:.5px;
    font-weight:600;
    color:#9fd6ff;
    text-transform:uppercase;
  }
  .topbar p{
    margin:0;
    font-size:13.5px;
    color:#b9c6df;
    line-height:1.5;
  }
  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    padding:5px 14px;
    border-radius:999px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    font-size:12.5px;
    color:#cfe3ff;
  }
  .status-dot{
    width:8px; height:8px; border-radius:50%;
    background:#4a5a78;
    transition:background .15s ease, box-shadow .15s ease;
  }
  .status-dot.fist{ background:#ffb454; box-shadow:0 0 8px #ffb454;}
  .status-dot.point{ background:var(--accent); box-shadow:0 0 10px var(--accent);}

  /* ---------- Camera preview ---------- */
  .cam-wrap{
    position:absolute;
    top:14px; right:14px;
    width:150px; height:112px;
    border-radius:14px;
    overflow:hidden;
    border:2px solid rgba(255,255,255,0.15);
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    background:#000;
    z-index:25;
  }
  .cam-wrap video, .cam-wrap canvas{
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    transform:scaleX(-1);
    object-fit:cover;
  }
  .cam-label{
    position:absolute; bottom:3px; left:6px;
    font-size:9px; color:#dfe9ff;
    background:rgba(0,0,0,0.45);
    padding:2px 6px; border-radius:6px;
  }

  /* ---------- Button ---------- */
  .btn-zone{
    position:relative;
    width:220px; height:220px;
    display:flex; align-items:center; justify-content:center;
  }
  .ring{
    position:absolute;
    width:220px; height:220px;
    border-radius:50%;
    border:2px solid rgba(34,224,122,0.25);
  }
  .ring.r2{ width:250px; height:250px; border-color:rgba(34,224,122,0.14);}
  .pulse{
    position:absolute;
    width:170px; height:170px;
    border-radius:50%;
    background:rgba(34,224,122,0.35);
    opacity:0;
  }
  .pulse.active{ animation:pulseOut 1.1s ease-out infinite; }
  @keyframes pulseOut{
    0%{ transform:scale(0.9); opacity:.55;}
    100%{ transform:scale(1.55); opacity:0;}
  }

  .btn{
    position:relative;
    width:170px; height:170px;
    border-radius:50%;
    cursor:pointer;
    border:none;
    outline:none;
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,0.9), rgba(255,255,255,0) 34%),
      radial-gradient(circle at 50% 50%, #4dfb9e 0%, #1fce74 42%, #0c8a4c 78%, #06612f 100%);
    box-shadow:
      0 14px 26px rgba(6,60,30,0.55),
      0 3px 0 #0a5b30,
      inset 0 4px 10px rgba(255,255,255,0.55),
      inset 0 -10px 18px rgba(0,0,0,0.35);
    transition: transform .09s ease, box-shadow .09s ease;
  }
  .btn::after{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 68% 78%, rgba(0,0,0,0.18), transparent 55%);
  }
  .btn-label{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:700; letter-spacing:1px;
    color:#04331b;
    text-shadow:0 1px 0 rgba(255,255,255,0.35);
    user-select:none;
  }
  .btn.pressed{
    transform:translateY(8px) scale(0.94);
    box-shadow:
      0 4px 10px rgba(6,60,30,0.5),
      0 1px 0 #0a5b30,
      inset 0 6px 14px rgba(0,0,0,0.45),
      inset 0 -4px 8px rgba(255,255,255,0.18);
  }
  .btn.highlight{
    box-shadow:
      0 14px 30px rgba(34,224,122,0.55),
      0 3px 0 #0a5b30,
      inset 0 4px 10px rgba(255,255,255,0.65),
      inset 0 -10px 18px rgba(0,0,0,0.3),
      0 0 0 10px rgba(34,224,122,0.18);
  }

  /* fingertip cursor */
  .fingertip{
    position:fixed;
    width:22px; height:22px;
    border-radius:50%;
    border:2.5px solid #ffd166;
    background:rgba(255,209,102,0.25);
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:40;
    display:none;
    box-shadow:0 0 12px rgba(255,209,102,0.7);
  }

  /* ---------- Robot ---------- */
  .robot{
    position:absolute;
    font-size:92px;
    line-height:1;
    z-index:30;
    left:50%; top:50%;
    transform:translate(-50%,-260%) rotate(-8deg) scale(0.7);
    opacity:0;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,0.5));
    pointer-events:none;
  }
  .robot.enter{
    animation: robotDrop .55s cubic-bezier(.3,1.4,.5,1) forwards;
  }
  .robot.tap{
    animation: robotTap .35s ease-in-out 2;
  }
  .robot.leave{
    animation: robotLeave .5s ease-in forwards;
  }
  @keyframes robotDrop{
    0%{ opacity:0; transform:translate(-50%,-320%) rotate(-14deg) scale(0.55);}
    70%{ opacity:1; transform:translate(-50%,-118%) rotate(4deg) scale(1.05);}
    100%{ opacity:1; transform:translate(-50%,-128%) rotate(0deg) scale(1);}
  }
  @keyframes robotTap{
    0%{ transform:translate(-50%,-128%) rotate(0deg) scale(1);}
    50%{ transform:translate(-50%,-108%) rotate(-3deg) scale(0.97);}
    100%{ transform:translate(-50%,-128%) rotate(0deg) scale(1);}
  }
  @keyframes robotLeave{
    0%{ opacity:1; transform:translate(-50%,-128%) scale(1);}
    100%{ opacity:0; transform:translate(-50%,-260%) scale(0.6);}
  }

  .spark{
    position:absolute; left:50%; top:50%;
    width:10px; height:10px;
    transform:translate(-50%,-50%);
    z-index:15;
    pointer-events:none;
  }
  .spark span{
    position:absolute; left:0; top:0;
    width:6px; height:6px; border-radius:50%;
    background:#ffe9a8;
    opacity:0;
  }
  .spark.go span{
    animation: sparkFly .6s ease-out forwards;
  }
  @keyframes sparkFly{
    0%{ opacity:1; transform:translate(0,0) scale(1);}
    100%{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(0.3);}
  }

  /* ---------- Welcome text ---------- */
  .welcome{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    z-index:50;
    pointer-events:none;
  }
  .welcome-line{
    display:flex;
    white-space:pre;
  }
  .welcome-line .ch{
    display:inline-block;
    font-weight:800;
    opacity:0;
    transform:translateY(40px) scale(0.6);
    color:transparent;
    background:linear-gradient(180deg,#eafff2 0%, #7bffb0 45%, #1fce74 100%);
    -webkit-background-clip:text;
    background-clip:text;
    text-shadow:0 0 26px rgba(34,224,122,0.35);
  }
  .welcome-line.line1 .ch{ font-size:34px; }
  .welcome-line.line2 .ch{ font-size:46px; letter-spacing:1px; }
  .welcome.show .ch{
    animation: chRise .6s cubic-bezier(.2,1.6,.4,1) forwards;
  }
  @keyframes chRise{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .replay{
    position:absolute;
    bottom:26px; left:50%; transform:translateX(-50%);
    padding:9px 20px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.06);
    color:#dfe9ff;
    font-size:13px;
    cursor:pointer;
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .replay.show{ opacity:1; pointer-events:auto; }

  .cam-error{
    position:absolute; top:14px; right:14px;
    width:150px;
    font-size:10.5px;
    color:#ffcf9e;
    background:rgba(60,30,10,0.55);
    border:1px solid rgba(255,180,100,0.3);
    border-radius:10px;
    padding:8px;
    display:none;
    z-index:25;
    line-height:1.4;
  }
</style>
</head>
<body>

<div class="stage">

  <div class="topbar">
    <h1>Hand Gesture Button · AI Detection</h1>
    <p>ทำท่า <b>กำมือ</b> แล้ว <b>ยื่นนิ้วชี้</b> ออกมาแตะที่ปุ่มสีเขียวเพื่อกด<br>
       (หรือคลิก/แตะที่ปุ่มโดยตรงเพื่อทดสอบ)</p>
    <div class="status-pill">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">กำลังเปิดกล้อง…</span>
    </div>
  </div>

  <div class="cam-wrap" id="camWrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
    <div class="cam-label">MediaPipe Hands</div>
  </div>
  <div class="cam-error" id="camError"></div>

  <div class="btn-zone">
    <div class="ring r2"></div>
    <div class="ring"></div>
    <div class="pulse" id="pulse"></div>
    <div class="spark" id="spark"></div>
    <button class="btn" id="pressBtn">
      <span class="btn-label">PRESS</span>
    </button>
    <div class="robot" id="robot">🤖</div>
  </div>

  <div class="welcome" id="welcome">
    <div class="welcome-line line1" id="line1"></div>
    <div class="welcome-line line2" id="line2"></div>
  </div>

  <div class="fingertip" id="fingertip"></div>

  <div class="replay" id="replayBtn">↺ กดใหม่อีกครั้ง</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
(function(){
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const pressBtn = document.getElementById('pressBtn');
  const pulse = document.getElementById('pulse');
  const fingertip = document.getElementById('fingertip');
  const robot = document.getElementById('robot');
  const spark = document.getElementById('spark');
  const welcome = document.getElementById('welcome');
  const line1El = document.getElementById('line1');
  const line2El = document.getElementById('line2');
  const replayBtn = document.getElementById('replayBtn');
  const camError = document.getElementById('camError');
  const camWrap = document.getElementById('camWrap');
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const octx = overlay.getContext('2d');

  let wasFist = false;
  let armed = false;         // true right after a fist -> ready to accept a point-press
  let triggered = false;     // demo already fired, waiting for reset
  let lastTriggerTime = 0;

  // ---------- Build arcing welcome text ----------
  function buildArcLine(container, text, arcHeight){
    container.innerHTML = '';
    const chars = text.split('');
    const n = chars.length;
    chars.forEach((c, i)=>{
      const span = document.createElement('span');
      span.className = 'ch';
      span.textContent = c === ' ' ? '\u00A0' : c;
      const t = n > 1 ? i/(n-1) : 0.5;
      const arcOffset = -Math.sin(t*Math.PI) * arcHeight; // negative = move up
      span.style.setProperty('--restY', arcOffset + 'px');
      span.style.transitionDelay = (i*45)+'ms';
      span.style.animationDelay = (i*45)+'ms';
      // set final resting transform via CSS var trick using inline style override after animation
      span.dataset.rest = arcOffset;
      container.appendChild(span);
    });
  }
  buildArcLine(line1El, 'Wellcome to', 10);
  buildArcLine(line2El, 'science week 2026', 22);

  function playWelcome(){
    // apply arc resting position by animating translateY(0) then nudge to arc offset after
    welcome.classList.add('show');
    const allCh = welcome.querySelectorAll('.ch');
    allCh.forEach(span=>{
      span.addEventListener('animationend', ()=>{
        const rest = parseFloat(span.dataset.rest||'0');
        span.style.transform = `translateY(${rest}px) scale(1)`;
        span.style.transition = 'transform .4s ease';
      }, {once:true});
    });
  }

  function resetWelcome(){
    welcome.classList.remove('show');
    welcome.querySelectorAll('.ch').forEach(span=>{
      span.style.transition = '';
      span.style.transform = '';
      span.style.opacity = 0;
    });
  }

  // ---------- Spark burst ----------
  function burstSpark(){
    spark.innerHTML = '';
    spark.classList.remove('go');
    const N = 10;
    for(let i=0;i<N;i++){
      const s = document.createElement('span');
      const ang = (Math.PI*2*i)/N;
      const dist = 55 + Math.random()*25;
      s.style.setProperty('--dx', (Math.cos(ang)*dist)+'px');
      s.style.setProperty('--dy', (Math.sin(ang)*dist)+'px');
      spark.appendChild(s);
    }
    void spark.offsetWidth;
    spark.classList.add('go');
  }

  // ---------- Full press sequence ----------
  function firePress(){
    if (triggered) return;
    triggered = true;
    lastTriggerTime = Date.now();

    pressBtn.classList.add('pressed','highlight');
    pulse.classList.remove('active');
    burstSpark();

    setTimeout(()=>{
      robot.classList.add('enter');
    }, 120);

    setTimeout(()=>{
      robot.classList.remove('enter');
      robot.classList.add('tap');
      pressBtn.classList.add('pressed');
    }, 700);

    setTimeout(()=>{
      robot.classList.remove('tap');
      robot.classList.add('leave');
      pressBtn.classList.remove('pressed');
    }, 1450);

    setTimeout(()=>{
      robot.classList.remove('leave');
      pressBtn.style.opacity = '0';
      pressBtn.style.transform = 'scale(0.7)';
      pressBtn.style.transition = 'opacity .4s ease, transform .4s ease';
      playWelcome();
      replayBtn.classList.add('show');
    }, 1950);
  }

  function resetDemo(){
    triggered = false;
    wasFist = false;
    armed = false;
    pressBtn.classList.remove('pressed','highlight');
    pressBtn.style.opacity = '1';
    pressBtn.style.transform = 'scale(1)';
    resetWelcome();
    replayBtn.classList.remove('show');
  }

  replayBtn.addEventListener('click', resetDemo);

  // Manual fallback: direct click/tap on the button
  pressBtn.addEventListener('click', ()=>{ firePress(); });

  // ---------- MediaPipe Hands setup ----------
  function setStatus(text, mode){
    statusText.textContent = text;
    statusDot.className = 'status-dot' + (mode ? (' '+mode) : '');
  }

  function dist(a,b){
    return Math.hypot(a.x-b.x, a.y-b.y);
  }

  function classifyHand(lm){
    // y smaller = higher on screen (finger extended upward)
    const indexExt  = lm[8].y  < lm[6].y  - 0.02;
    const middleExt = lm[12].y < lm[10].y - 0.02;
    const ringExt   = lm[16].y < lm[14].y - 0.02;
    const pinkyExt  = lm[20].y < lm[18].y - 0.02;
    const thumbCurled = dist(lm[4], lm[9]) < 0.14;

    const allCurled = !indexExt && !middleExt && !ringExt && !pinkyExt && thumbCurled;
    const pointing  = indexExt && !middleExt && !ringExt && !pinkyExt;

    if (allCurled) return 'fist';
    if (pointing) return 'point';
    return 'other';
  }

  function onResults(results){
    overlay.width = video.videoWidth || 320;
    overlay.height = video.videoHeight || 240;
    octx.save();
    octx.clearRect(0,0,overlay.width, overlay.height);

    if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0){
      fingertip.style.display = 'none';
      pulse.classList.remove('active');
      if (!triggered) setStatus('ไม่พบมือในกล้อง — ยกมือขึ้นให้เห็นในเฟรม', '');
      octx.restore();
      return;
    }

    const lm = results.multiHandLandmarks[0];

    // draw skeleton in mini camera preview
    if (window.drawConnectors && window.HAND_CONNECTIONS){
      drawConnectors(octx, lm, HAND_CONNECTIONS, {color:'#22e07a', lineWidth:2});
      drawLandmarks(octx, lm, {color:'#ffd166', radius:2});
    }
    octx.restore();

    const gesture = classifyHand(lm);

    if (gesture === 'fist'){
      wasFist = true;
      armed = true;
      setStatus('ตรวจพบท่า "กำมือ" — ยื่นนิ้วชี้ไปที่ปุ่มได้เลย', 'fist');
    } else if (gesture === 'point'){
      setStatus(armed ? 'กำลังชี้… เล็งไปที่ปุ่มสีเขียว' : 'ยื่นนิ้วชี้ (ควรกำมือก่อนหนึ่งครั้ง)', 'point');
    } else if (!triggered){
      setStatus('พร้อมตรวจจับท่ามือ…', '');
    }

    // fingertip cursor position -> map to screen coords (mirror x)
    const tip = lm[8];
    const rect = video.getBoundingClientRect(); // camera preview box (small); we instead map to full stage
    // Map using the *video* intrinsic frame onto the full window, mirrored horizontally,
    // assuming the user's hand roughly spans the camera's field of view over the stage area.
    const stageRect = document.querySelector('.stage').getBoundingClientRect();
    const mirroredX = 1 - tip.x;
    const screenX = stageRect.left + mirroredX * stageRect.width;
    const screenY = stageRect.top + tip.y * stageRect.height;

    fingertip.style.display = 'block';
    fingertip.style.left = screenX + 'px';
    fingertip.style.top = screenY + 'px';

    // check overlap with button
    const btnRect = pressBtn.getBoundingClientRect();
    const bcx = btnRect.left + btnRect.width/2;
    const bcy = btnRect.top + btnRect.height/2;
    const r = btnRect.width/2;
    const overlapping = Math.hypot(screenX-bcx, screenY-bcy) < r;

    if (gesture === 'point' && overlapping){
      pulse.classList.add('active');
      if (armed && !triggered){
        firePress();
      }
    } else {
      pulse.classList.remove('active');
    }
  }

  async function startCamera(){
    try{
      const hands = new Hands({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });
      hands.onResults(onResults);

      const camera = new Camera(video, {
        onFrame: async ()=>{ await hands.send({image: video}); },
        width: 480,
        height: 360
      });
      await camera.start();
      setStatus('พร้อมตรวจจับท่ามือ…', '');
    }catch(err){
      console.error(err);
      camWrap.style.display = 'none';
      camError.style.display = 'block';
      camError.textContent = 'ไม่สามารถเข้าถึงกล้องได้ในเบราว์เซอร์นี้ — สามารถคลิก/แตะที่ปุ่มสีเขียวโดยตรงเพื่อทดสอบระบบแทนได้';
      setStatus('ไม่พบกล้อง — คลิกที่ปุ่มเพื่อทดสอบแทน', '');
    }
  }

  startCamera();
})();
</script>
</body>
</html>
